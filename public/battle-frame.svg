<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="battleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#battleBg)"/>
  
  <!-- Title -->
  <text x="600" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff" stroke="#ff0000" stroke-width="2">
    BATTLE MODE
  </text>
  
  <!-- Player -->
  <circle cx="300" cy="350" r="100" fill="#4169e1" stroke="#ffffff" stroke-width="6"/>
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">🤺</text>
  <text x="300" y="480" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">PLAYER</text>
  
  <!-- VS -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#ffff00" stroke="#ff0000" stroke-width="2">
    VS
  </text>
  
  <!-- Enemy -->
  <circle cx="900" cy="350" r="100" fill="#8b0000" stroke="#ffffff" stroke-width="6"/>
  <text x="900" y="370" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">👹</text>
  <text x="900" y="480" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">ENEMY</text>
  
  <!-- Action text -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ffdd44">
    Choose your action!
  </text>
</svg>